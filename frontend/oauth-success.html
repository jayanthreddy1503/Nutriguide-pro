<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Signing you in… — NutriGuide Pro</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600&display=swap" rel="stylesheet"/>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center;
      background: #fdf8f2; color: #1a2e1a;
    }
    .spinner {
      width: 34px; height: 34px; border: 3px solid #e0ebe3; border-top-color: #3ecf8e;
      border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { font-weight: 600; }
  </style>
</head>
<body>
  <div style="text-align:center">
    <div class="spinner"></div>
    <p>Finishing sign-in…</p>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script>
    // The OAuth callback already set our httpOnly JWT cookie server-side.
    // We just need to fetch the profile once to populate the local UI cache,
    // then continue on to the dashboard like any other successful login.
    (async () => {
      try {
        const data = await apiRequest('/auth/me');
        Auth.setSession(data.user);
      } catch (err) {
        // Cookie wasn't set / request failed — send them back to try again.
        window.location.href = 'login.html?error=oauth';
        return;
      }
      window.location.href = 'dashboard.html';
    })();
  </script>
</body>
</html>
