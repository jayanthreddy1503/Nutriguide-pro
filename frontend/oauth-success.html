<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Signing you in… — NutriGuide Pro</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600&display=swap" rel="stylesheet"/>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center;
      background: #fdf8f2; color: #1a2e1a;
    }
    .spinner {
      width: 34px; height: 34px; border: 3px solid #e0ebe3; border-top-color: #3ecf8e;
      border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { font-weight: 600; }
  </style>
</head>
<body>
  <div style="text-align:center">
    <div class="spinner"></div>
    <p>Finishing sign-in…</p>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script>
    // The OAuth callback redirected here with a short-lived, single-use
    // ?code=... in the URL (NOT the real auth cookie — see
    // authController.handleOAuthSuccess for why). We exchange it here via
    // a direct fetch() call, which is what actually sets the real httpOnly
    // cookie. Doing it this way (instead of setting the cookie during the
    // Google -> API -> frontend redirect chain) avoids Chrome's Bounce
    // Tracking Mitigations wiping the cookie right after the redirect.
    (async () => {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');

      if (!code) {
        window.location.href = 'login.html?error=oauth';
        return;
      }

      try {
        const data = await apiRequest('/auth/oauth/exchange', {
          method: 'POST',
          body: { code }
        });
        Auth.setSession(data.user);
      } catch (err) {
        // Code invalid/expired/exchange failed — send them back to try again.
        window.location.href = 'login.html?error=oauth';
        return;
      }
      window.location.href = 'dashboard.html';
    })();
  </script>
</body>
</html>
