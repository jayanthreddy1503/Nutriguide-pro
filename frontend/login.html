<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — NutriGuide Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <link rel="stylesheet" href="css/login.css"/>
  <link rel="stylesheet" href="css/register.css"/>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-left">
      <a href="index.html" class="brand">🥬 NutriGuide <span>Pro</span></a>
      <div class="auth-tagline">
        <h1>Track. Improve.<br/><em>Thrive.</em></h1>
        <p>Your personalized health companion — calories, BMI, hydration and more.</p>
      </div>
      <div class="auth-stats">
        <div><strong>10K+</strong><span>Users</span></div>
        <div><strong>98%</strong><span>Success Rate</span></div>
        <div><strong>50+</strong><span>Diet Plans</span></div>
      </div>
    </div>

    <div class="auth-right">
      <div class="auth-card">
        <h2>Welcome back</h2>
        <p class="auth-sub">Sign in to your account to continue.</p>

        <div id="errorMsg" class="alert hidden"></div>

        <div class="social-buttons">
          <a href="#" data-api-href="/api/auth/google" class="social-btn google-btn" id="googleAuthBtn">
            <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="" width="18" height="18"/>
            Continue with Google
          </a>
        </div>

        <div class="divider"><span>or sign in with email</span></div>

        <div class="input-group">
          <label for="email"><i class="fas fa-envelope"></i> Email</label>
          <input type="email" id="email" placeholder="you@example.com"/>
        </div>

        <div class="input-group">
          <label for="password"><i class="fas fa-lock"></i> Password</label>
          <div class="password-wrap">
            <input type="password" id="password" placeholder="Your password"/>
            <button type="button" class="toggle-pw" id="togglePw"><i class="fas fa-eye"></i></button>
          </div>
        </div>

        <button class="submit-btn" id="loginBtn" onclick="handleLogin()">
          <span>Sign In</span> <i class="fas fa-arrow-right"></i>
        </button>

        <p class="switch-link">Don't have an account? <a href="register.html">Register</a></p>
        <a href="index.html" class="back-home"><i class="fas fa-chevron-left"></i> Back to home</a>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
